name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload to (e.g. v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac --arm64
            sqlite_arch: arm64
          - os: macos-latest
            args: --mac --x64 --config.npmRebuild=false
            sqlite_arch: x64
          - os: windows-2022
            args: --win

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python 3.11 (node-gyp needs distutils removed in Python 3.12+)
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Set version from tag
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${{ steps.tag.outputs.tag }}'.replace(/^v/, '');
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Version set to:', pkg.version);

      - name: Rebuild better-sqlite3 for target arch
        if: matrix.sqlite_arch != ''
        run: npx electron-rebuild -f -w better-sqlite3 --arch ${{ matrix.sqlite_arch }}

      - name: Build and publish
        run: npm run build && npx electron-builder ${{ matrix.args }} --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-store-msix:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Set version from tag
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${{ steps.tag.outputs.tag }}'.replace(/^v/, '');
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Version set to:', pkg.version);

      - name: Build Angular + Electron
        run: npm run build

      - name: Rebuild better-sqlite3 for x64
        run: npx electron-rebuild -f -w better-sqlite3 --arch x64

      - name: Build MSIX for x64
        run: npx electron-builder --win appx --x64 --config.npmRebuild=false --publish never

      - name: Rebuild better-sqlite3 for arm64
        run: npx electron-rebuild -f -w better-sqlite3 --arch arm64

      - name: Build MSIX for arm64
        run: npx electron-builder --win appx --arm64 --config.npmRebuild=false --publish never

      - name: Upload Store packages to release
        shell: bash
        run: |
          find release -maxdepth 2 \( -name "*.msix" -o -name "*.appx" \) | while read FILE; do
            echo "Uploading: $FILE"
            gh release upload ${{ steps.tag.outputs.tag }} "$FILE" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-store-mas:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Using tag: $TAG"

      - name: Set version from tag
        shell: node {0}
        run: |
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = '${{ steps.tag.outputs.tag }}'.replace(/^v/, '');
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          console.log('Version set to:', pkg.version);

      - name: Rebuild better-sqlite3 for arm64
        run: npx electron-rebuild -f -w better-sqlite3 --arch arm64
        env:
          npm_config_arch: arm64

      - name: Copy arm64 native module
        run: cp node_modules/better-sqlite3/build/Release/better_sqlite3.node /tmp/better_sqlite3_arm64.node

      - name: Rebuild better-sqlite3 for x64
        run: npx electron-rebuild -f -w better-sqlite3 --arch x64
        env:
          npm_config_arch: x64

      - name: Copy x64 native module
        run: cp node_modules/better-sqlite3/build/Release/better_sqlite3.node /tmp/better_sqlite3_x64.node

      - name: Create universal better-sqlite3
        run: |
          lipo -create -output node_modules/better-sqlite3/build/Release/better_sqlite3.node \
            /tmp/better_sqlite3_arm64.node \
            /tmp/better_sqlite3_x64.node

      - name: Build Angular + Electron
        run: npm run build

      - name: Build universal MAS package
        run: npx electron-builder --config electron-builder-mas.yml --mac --universal --config.npmRebuild=false --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CERTS_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload MAS package to release
        shell: bash
        run: |
          find release-mas -maxdepth 2 -name "*.pkg" | while read FILE; do
            echo "Uploading: $FILE"
            gh release upload ${{ steps.tag.outputs.tag }} "$FILE" --clobber
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
