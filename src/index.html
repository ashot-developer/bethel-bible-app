<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Բեթել Մրգաշատ Աստվածաշունչ</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' http://localhost:*; img-src 'self' data:; font-src 'self' data: http://localhost:*;">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      gap: 1.5rem;
      transition: opacity 0.35s ease;
    }
    #app-loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #app-loader img {
      width: min(120px, 30vw);
      height: min(120px, 30vw);
      border-radius: 50%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
    }
    #app-loader .app-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: clamp(1rem, 4vw, 1.2rem);
      font-weight: 600;
      color: #555;
      letter-spacing: 0.01em;
    }
    #app-loader .spinner {
      width: clamp(28px, 7vw, 36px);
      height: clamp(28px, 7vw, 36px);
      border: 2.5px solid rgba(245, 166, 35, 0.2);
      border-top-color: #f5a623;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #app-loader.mobile img { display: none; }
    #app-loader.mobile .spinner { order: 1; }
    #app-loader.mobile .app-name { order: 2; }
  </style>
</head>
<body class="m-0 p-0">

  <div id="app-loader">
    <img src="assets/logo.png" alt="Bethel" />
    <div class="app-name">Բեթել Մրգաշատ Աստվածաշունչ</div>
    <div class="spinner"></div>
  </div>
  <script>
    if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.getElementById('app-loader').classList.add('mobile');
    }
  </script>

  <app-root></app-root>
</body>
</html>
